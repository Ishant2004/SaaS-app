name: Deploy to AWS EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env.local from secret
        run: echo "${{ secrets.ENV_LOCAL }}" > .env.local

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Copy files to EC2 (include .env.local)
        run: |
          rsync -avz --exclude=node_modules --exclude=.next --exclude=.git -e "ssh -o StrictHostKeyChecking=no" ./ ubuntu@ec2-65-2-136-130.ap-south-1.compute.amazonaws.com:/home/ubuntu/saas

      - name: Deploy on EC2
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@ec2-65-2-136-130.ap-south-1.compute.amazonaws.com << 'EOF'
            cd ~/saas
            docker build -t saas-app .
            docker stop saas-app || true
            docker rm saas-app || true
            docker run -d --name saas-app --env-file .env.local -p 80:3000 saas-app
          EOF
